<style>
  :root {
    --bg: #14171b;
    --surface: #1e232b;
    --surface-2: #262c36;
    --text: #e9e4dc;
    --text-dim: #9aa1ab;
    --brick: #e8483a;
    --brick-dim: #7a2a24;
    --yellow: #f2b705;
    --teal: #3e8e7e;
    --purple: #8b6bd8;
    --stud: #33393f;
    --radius-lg: 34px;
    --radius-md: 22px;
    --radius-sm: 14px;
    --font-display: 'Baloo 2', system-ui, sans-serif;
    --font-body: 'Manrope', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f1ede4; --surface: #ffffff; --surface-2: #f6f2ea;
      --text: #201c16; --text-dim: #6b6459; --stud: #e3ddd0;
    }
  }
  :root[data-theme="light"] {
    --bg: #f1ede4; --surface: #ffffff; --surface-2: #f6f2ea;
    --text: #201c16; --text-dim: #6b6459; --stud: #e3ddd0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 10px; }

  #app { display: flex; height: 100vh; height: 100dvh; }

  /* ---------- Rail ---------- */
  #rail { width: 108px; flex-shrink: 0; background: var(--surface); display: flex; flex-direction: column; align-items: center; padding: calc(env(safe-area-inset-top,0px) + 20px) 0 16px; gap: 14px; }
  .rail-logo { width: 44px; height: 44px; background: var(--brick); border-radius: 30% / 30%; margin-bottom: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .rail-logo svg { width: 26px; height: 26px; }
  .mode-btn { width: 76px; height: 76px; background: var(--surface-2); border: none; border-radius: 32% / 32%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-dim); font-family: var(--font-display); font-weight: 600; font-size: 12.5px; cursor: pointer; transition: transform .18s ease, background .18s ease, color .18s ease; }
  .mode-btn svg { width: 26px; height: 26px; }
  .mode-btn.active { background: var(--brick); color: #fff; transform: scale(1.04); }
  .mode-btn[data-mode="sound"].active { background: var(--teal); }
  .mode-btn[data-mode="collection"].active { background: var(--yellow); color: #241c00; }
  .mode-btn:active { transform: scale(0.94); }
  .rail-spacer { flex: 1; }

  /* ---------- Main ---------- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .view { display: none; flex-direction: column; height: 100%; overflow: hidden; }
  .view.active { display: flex; }
  .view-header { padding: calc(env(safe-area-inset-top,0px) + 22px) 28px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0; flex-wrap: wrap; }
  .view-title { font-family: var(--font-display); font-weight: 700; font-size: 30px; margin: 0; }
  .view-sub { color: var(--text-dim); font-size: 14px; margin-top: 2px; }

  .btn { font-family: var(--font-body); font-weight: 700; font-size: 14px; border: none; border-radius: 999px; padding: 11px 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; color: #fff; background: var(--brick); transition: transform .12s ease; white-space: nowrap; }
  .btn:active { transform: scale(0.96); }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.teal { background: var(--teal); }
  .btn:disabled { opacity: .5; }
  .btn svg { width: 16px; height: 16px; }

  .scroll { flex: 1; overflow-y: auto; padding: 4px 28px 140px; }

  .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; padding-top: 6px; }
  .tile { background: var(--surface); border-radius: var(--radius-lg); padding: 14px; cursor: pointer; border: none; text-align: left; color: var(--text); font-family: var(--font-body); display: flex; flex-direction: column; gap: 10px; transition: transform .15s ease; position: relative; }
  .tile:active { transform: scale(0.97); }
  .tile-art { width: 100%; aspect-ratio: 1/1; border-radius: 30% / 30%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--text-dim); overflow: hidden; }
  .tile-art img { width: 100%; height: 100%; object-fit: cover; }
  .tile-art.brick-art { background: linear-gradient(155deg, var(--brick), var(--brick-dim)); }
  .tile-art.album-art { background: linear-gradient(155deg, var(--teal), #235349); }
  .tile-art.playlist-art { background: linear-gradient(155deg, var(--yellow), #a87c04); }
  .tile-art.genre-art { background: linear-gradient(155deg, var(--purple), #4c3a86); }
  .tile-art.artist-art { background: linear-gradient(155deg, var(--brick), var(--brick-dim)); }
  .tile-art.tag-art { background: linear-gradient(155deg, #4e9ad8, #235071); }
  .tile-art svg { width: 40%; height: 40%; opacity: .9; }
  .tile-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.2; }
  .tile-meta { font-size: 12.5px; color: var(--text-dim); }
  .tile.add-tile { align-items: center; justify-content: center; border: 2px dashed var(--surface-2); background: transparent; min-height: 100%; }
  .tile.add-tile .tile-art { background: transparent; }
  .tile.add-tile svg { width: 34px; height: 34px; color: var(--text-dim); }

  .empty-state { color: var(--text-dim); font-size: 15px; padding: 40px 4px; max-width: 360px; }
  .empty-state b { color: var(--text); }

  .segmented { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 2px; width: fit-content; flex-wrap: wrap; }
  .segmented button { border: none; background: transparent; color: var(--text-dim); font-family: var(--font-body); font-weight: 700; font-size: 13.5px; padding: 9px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .segmented button.active { background: var(--teal); color: #fff; }

  /* ---------- PDF Viewer overlay ---------- */
  #pdfOverlay { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 50; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #pdfOverlay.active { display: flex; }
  .pdf-bar, .pdf-nav { transition: opacity .25s ease; }
  #pdfOverlay.controls-hidden .pdf-bar, #pdfOverlay.controls-hidden .pdf-nav { opacity: 0; pointer-events: none; }
  .pdf-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; flex-shrink: 0; gap: 14px; }
  .pdf-bar-mid { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .pdf-bar-cover { width: 34px; height: 34px; border-radius: 26% / 26%; object-fit: cover; flex-shrink: 0; background: var(--stud); }
  .pdf-bar-title { font-family: var(--font-display); font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
  .pdf-bar-sub { color: var(--text-dim); font-size: 12.5px; text-align: left; }
  .icon-btn { width: 42px; height: 42px; border-radius: 30% / 30%; background: var(--surface-2); border: none; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.sm { width: 34px; height: 34px; }
  .icon-btn.sm svg { width: 16px; height: 16px; }
  .icon-btn:active { transform: scale(0.92); }
  #pdfCanvasWrap { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 8px 14px 20px; }
  #pdfCanvas { max-width: 100%; height: auto; border-radius: var(--radius-sm); box-shadow: 0 10px 30px rgba(0,0,0,.35); background: #fff; }
  .pdf-nav { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 14px 20px calc(18px + env(safe-area-inset-bottom,0px)); flex-shrink: 0; }
  .pdf-page-indicator { font-family: var(--font-display); font-weight: 700; font-size: 15px; min-width: 90px; text-align: center; }

  /* ---------- Now Playing bar ---------- */
  #nowPlaying { position: absolute; left: 108px; right: 0; bottom: 0; padding: 12px 28px calc(14px + env(safe-area-inset-bottom,0px)); background: linear-gradient(180deg, transparent, var(--bg) 40%); display: none; align-items: center; gap: 14px; pointer-events: none; }
  #nowPlaying.show { display: flex; }
  #nowPlaying .np-card { pointer-events: auto; background: var(--surface); border-radius: var(--radius-md); padding: 10px 16px 10px 10px; display: flex; align-items: center; gap: 12px; width: 100%; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
  #nowPlaying img.np-art { width: 44px; height: 44px; border-radius: 26% / 26%; object-fit: cover; background: var(--stud); flex-shrink: 0; display: none; }
  .np-art-fallback { width: 44px; height: 44px; border-radius: 26% / 26%; background: var(--stud); flex-shrink: 0; }
  .np-meta { flex: 1; min-width: 0; }
  .np-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-artist { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-progress { flex: 1; display: flex; align-items: center; gap: 10px; max-width: 320px; }
  .np-progress input[type=range] { flex: 1; accent-color: var(--teal); }
  .np-time { font-size: 11px; color: var(--text-dim); min-width: 34px; }
  .np-controls { display: flex; align-items: center; gap: 6px; }
  .np-controls button { background: none; border: none; color: var(--text); cursor: pointer; padding: 6px; }
  .np-controls button svg { width: 22px; height: 22px; }
  .np-controls button.play svg { width: 28px; height: 28px; }
  .np-volume { display: flex; align-items: center; gap: 6px; color: var(--text-dim); }
  .np-volume input[type=range] { width: 70px; accent-color: var(--teal); }
  @media (max-width: 900px) { .np-volume { display: none; } }

  .track-row { display: flex; align-items: center; gap: 14px; padding: 10px 10px; border-radius: var(--radius-sm); cursor: pointer; }
  .track-row:hover, .track-row:active { background: var(--surface); }
  .track-row.playing { background: var(--surface); }
  .track-row.playing .track-title { color: var(--teal); }
  .track-num { width: 22px; text-align: center; color: var(--text-dim); font-size: 13px; flex-shrink: 0; }
  .track-art { width: 42px; height: 42px; border-radius: 26% / 26%; background: var(--stud); flex-shrink: 0; object-fit: cover; }
  .track-title { font-weight: 700; font-size: 14.5px; }
  .track-sub { font-size: 12.5px; color: var(--text-dim); }
  .track-actions { margin-left: auto; display: flex; gap: 2px; }
  .track-actions button { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 6px; }
  .track-actions button svg { width: 18px; height: 18px; }

  .back-btn { margin-bottom: 14px; }

  /* ---------- Collection (Lego HQ) ---------- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border-radius: var(--radius-md); padding: 16px 10px; text-align: center; }
  .stat-card .stat-num { display: block; font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--yellow); }
  .stat-card .stat-label { font-size: 10.5px; color: var(--text-dim); letter-spacing: .05em; text-transform: uppercase; margin-top: 2px; }

  .spotlight { background: linear-gradient(155deg, rgba(242,183,5,.16), rgba(242,183,5,.04)); border: 2px dashed var(--yellow); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 20px; display: none; align-items: center; gap: 14px; }
  .spotlight.show { display: flex; }
  .spotlight-art { width: 52px; height: 52px; border-radius: 30% / 30%; background: var(--yellow); flex-shrink: 0; object-fit: cover; }
  .spotlight-eyebrow { font-size: 10.5px; color: var(--yellow); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
  .spotlight-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; margin-top: 2px; }
  .spotlight-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }

  .section-label { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .04em; color: var(--text-dim); margin: 4px 0 12px; }

  .set-tile { background: var(--surface); border-radius: var(--radius-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; position: relative; }
  .set-tile.is-wishlist { outline: 2px dashed var(--yellow); outline-offset: -2px; }
  .set-art { width: 100%; aspect-ratio: 1/1; border-radius: 30% / 30%; background: linear-gradient(155deg, var(--yellow), #a87c04); display: flex; align-items: flex-start; justify-content: flex-start; padding: 12px; gap: 6px; overflow: hidden; }
  .set-art img { width: 100%; height: 100%; object-fit: cover; margin: -12px; }
  .set-art .stud-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.55); }
  .set-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.2; }
  .set-meta { font-size: 12.5px; color: var(--text-dim); }
  .set-status-pill { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; margin-top: 2px; }
  .set-status-pill.wishlist { background: rgba(242,183,5,.18); color: var(--yellow); }
  .set-status-pill.building { background: rgba(62,142,126,.22); color: var(--teal); }
  .set-status-pill.built { background: rgba(232,72,58,.18); color: var(--brick); }
  .set-quick-btn { align-self: flex-start; font-family: var(--font-body); font-weight: 700; font-size: 12px; border: none; border-radius: 999px; padding: 7px 14px; cursor: pointer; background: var(--surface-2); color: var(--text); }
  .set-quick-btn.gotit { background: var(--teal); color: #fff; }
  .set-quick-btn.built { background: var(--brick); color: #fff; }

  /* ---------- Modal ---------- */
  #modalBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  #modalBackdrop.active { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 26px; width: 100%; max-width: 420px; max-height: 86vh; overflow-y: auto; }
  .modal h3 { font-family: var(--font-display); margin: 0 0 4px; font-size: 20px; }
  .modal .modal-note { color: var(--text-dim); font-size: 13px; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select { width: 100%; background: var(--surface-2); border: none; border-radius: var(--radius-sm); padding: 12px 14px; color: var(--text); font-family: var(--font-body); font-size: 14.5px; }
  .cover-picker { display: flex; align-items: center; gap: 14px; }
  .cover-preview { width: 72px; height: 72px; border-radius: 28% / 28%; background: var(--surface-2); object-fit: cover; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 28% / 28%; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }
  .queue-note { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }

  input[type=file] { display: none; }

  /* ---------- Debug console ---------- */
  #debugToggle { position: fixed; top: calc(env(safe-area-inset-top,0px) + 10px); right: 10px; width: 34px; height: 34px; border-radius: 30% / 30%; background: var(--surface-2); border: none; color: var(--text-dim); display: flex; align-items: center; justify-content: center; z-index: 210; opacity: .55; }
  #debugToggle svg { width: 17px; height: 17px; }
  #debugToggle.has-errors { color: #fff; background: var(--brick); opacity: 1; }
  #debugConsole { position: fixed; left: 0; right: 0; bottom: 0; max-height: 46vh; background: var(--surface); border-top: 1px solid var(--stud); z-index: 200; display: none; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
  #debugConsole.open { display: flex; }
  .debug-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--stud); flex-shrink: 0; }
  .debug-bar span { font-family: var(--font-display); font-weight: 700; font-size: 13px; }
  .debug-bar div { display: flex; gap: 8px; }
  .debug-bar button { background: var(--surface-2); border: none; color: var(--text); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  #debugList { flex: 1; overflow-y: auto; padding: 8px 14px 14px; font-family: ui-monospace, monospace; font-size: 11.5px; line-height: 1.5; }
  .debug-line { padding: 5px 0; border-bottom: 1px solid var(--surface-2); white-space: pre-wrap; word-break: break-word; }
  .debug-line.warn { color: var(--yellow); }
  .debug-line.error { color: var(--brick); }
  .debug-line .debug-time { color: var(--text-dim); margin-right: 8px; }

  @media (max-width: 640px) {
    #rail { width: 84px; }
    .mode-btn { width: 60px; height: 60px; font-size: 10.5px; }
    #nowPlaying { left: 84px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom,0px)); }
    .view-header { padding: calc(env(safe-area-inset-top,0px) + 18px) 16px 12px; }
    .scroll { padding: 4px 16px 140px; }
    .np-progress { display: none; }
    .pdf-bar-title { max-width: 40vw; }
  }
</style>
</head>
<body>
<div id="app">
  <nav id="rail">
    <div class="rail-logo">
      <svg viewBox="0 0 24 24" fill="#fff">
        <circle cx="8" cy="7.5" r="2.1"></circle>
        <circle cx="16" cy="7.5" r="2.1"></circle>
        <rect x="6.1" y="13.6" width="2.6" height="5.4" rx="1.3"></rect>
        <rect x="10.7" y="11.4" width="2.6" height="7.6" rx="1.3"></rect>
        <rect x="15.3" y="13" width="2.6" height="6" rx="1.3"></rect>
      </svg>
    </div>
    <button class="mode-btn active" data-mode="build" onclick="setMode('build')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg>
      Build
    </button>
    <button class="mode-btn" data-mode="sound" onclick="setMode('sound')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      Sound
    </button>
    <button class="mode-btn" data-mode="collection" onclick="setMode('collection')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="2"></rect><circle cx="9" cy="6" r="1.6" fill="currentColor" stroke="none"></circle><circle cx="15" cy="6" r="1.6" fill="currentColor" stroke="none"></circle></svg>
      Lego HQ
    </button>
    <div class="rail-spacer"></div>
  </nav>

  <main id="main">
    <!-- BUILD VIEW -->
    <section class="view active" id="view-build">
      <div class="view-header">
        <div>
          <h1 class="view-title">Instructions</h1>
          <div class="view-sub" id="buildSub">Your Lego manuals, ready to build from</div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap: wrap;">
          <button class="btn ghost" onclick="openBackupModal()" title="Backup & restore">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19a5 5 0 0 1-1-9.9A6 6 0 0 1 17.5 8.5 4.5 4.5 0 0 1 17 17.5"></path><path d="M12 12v8M9 17l3 3 3-3"></path></svg>
          </button>
          <button class="btn ghost" onclick="openFolderGuideModal()" title="How folder import works">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 1.7-2.2 1.9-2.4 3.3"></path><circle cx="12" cy="16.3" r=".4" fill="currentColor" stroke="none"></circle></svg>
          </button>
          <button class="btn ghost" onclick="document.getElementById('folderImportInput').click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"></path></svg>
            Import from Files
          </button>
          <button class="btn" onclick="document.getElementById('pdfInput').click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            Add PDF
          </button>
        </div>
        <input type="file" id="pdfInput" accept="application/pdf" multiple>
      </div>
      <div class="scroll"><div class="tile-grid" id="buildGrid"></div></div>
    </section>

    <!-- SOUND VIEW -->
    <section class="view" id="view-sound">
      <div class="view-header">
        <div>
          <h1 class="view-title">Sound</h1>
          <div class="view-sub">Play music while you build</div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap: wrap;">
          <button class="btn ghost" onclick="openBackupModal()" title="Backup & restore">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19a5 5 0 0 1-1-9.9A6 6 0 0 1 17.5 8.5 4.5 4.5 0 0 1 17 17.5"></path><path d="M12 12v8M9 17l3 3 3-3"></path></svg>
          </button>
          <button class="btn ghost" onclick="openFolderGuideModal()" title="How folder import works">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 1.7-2.2 1.9-2.4 3.3"></path><circle cx="12" cy="16.3" r=".4" fill="currentColor" stroke="none"></circle></svg>
          </button>
          <button class="btn ghost" onclick="document.getElementById('folderImportInput').click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"></path></svg>
            Import from Files
          </button>
          <button class="btn ghost" onclick="openPlaylistModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            New playlist
          </button>
          <button class="btn teal" onclick="document.getElementById('mp3Input').click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            Add songs
          </button>
          <input type="file" id="mp3Input" accept="audio/*" multiple>
        </div>
      </div>
      <div style="padding: 0 28px;">
        <div class="segmented" id="soundSeg">
          <button class="active" data-seg="albums" onclick="setSoundSeg('albums')">Albums</button>
          <button data-seg="artists" onclick="setSoundSeg('artists')">Artists</button>
          <button data-seg="genres" onclick="setSoundSeg('genres')">Genres</button>
          <button data-seg="tags" onclick="setSoundSeg('tags')">Tags</button>
          <button data-seg="playlists" onclick="setSoundSeg('playlists')">Playlists</button>
          <button data-seg="favorites" onclick="setSoundSeg('favorites')">Favorites</button>
          <button data-seg="all" onclick="setSoundSeg('all')">All songs</button>
        </div>
      </div>
      <div class="scroll" id="soundScroll"></div>
    </section>

    <!-- COLLECTION (LEGO HQ) VIEW -->
    <section class="view" id="view-collection">
      <div class="view-header">
        <div>
          <h1 class="view-title">Lego HQ</h1>
          <div class="view-sub">Every set — wishlist to built</div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap: wrap;">
          <button class="btn ghost" onclick="openBackupModal()" title="Backup & restore">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19a5 5 0 0 1-1-9.9A6 6 0 0 1 17.5 8.5 4.5 4.5 0 0 1 17 17.5"></path><path d="M12 12v8M9 17l3 3 3-3"></path></svg>
          </button>
          <button class="btn" style="background: var(--yellow); color: #241c00;" onclick="openAddSetModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            Add set
          </button>
        </div>
      </div>
      <div class="scroll">
        <div class="stat-grid">
          <div class="stat-card"><span class="stat-num" id="legoBuiltCount">0</span><span class="stat-label">Sets built</span></div>
          <div class="stat-card"><span class="stat-num" id="legoPieceCount">0</span><span class="stat-label">Pieces owned</span></div>
          <div class="stat-card"><span class="stat-num" id="legoWishCount">0</span><span class="stat-label">On wishlist</span></div>
          <div class="stat-card"><span class="stat-num" id="legoWishValue">$0</span><span class="stat-label">Wishlist value</span></div>
        </div>
        <div class="spotlight" id="legoSpotlight"></div>
        <div class="segmented" id="legoSegControl" style="margin-bottom:16px;">
          <button data-lego-seg="all" onclick="setLegoSeg('all')">All</button>
          <button data-lego-seg="wishlist" onclick="setLegoSeg('wishlist')">Wishlist</button>
          <button data-lego-seg="building" onclick="setLegoSeg('building')">Building</button>
          <button data-lego-seg="built" onclick="setLegoSeg('built')">Built</button>
          <button data-lego-seg="theme" onclick="setLegoSeg('theme')">By theme</button>
        </div>
        <div class="section-label" id="legoSectionLabel">THE COLLECTION</div>
        <div class="tile-grid" id="legoGrid"></div>
      </div>
    </section>
  </main>
</div>

<div id="nowPlaying">
  <div class="np-card">
    <img class="np-art" id="npArt">
    <div class="np-art-fallback" id="npArtFallback"></div>
    <div class="np-meta">
      <div class="np-title" id="npTitle">Nothing playing</div>
      <div class="np-artist" id="npArtist">—</div>
    </div>
    <div class="np-progress">
      <span class="np-time" id="npCur">0:00</span>
      <input type="range" id="npSeek" min="0" max="100" value="0">
      <span class="np-time" id="npDur">0:00</span>
    </div>
    <div class="np-controls">
      <button onclick="prevTrack()" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6l-10 6 10 6z"/></svg></button>
      <button class="play" onclick="togglePlay()"><svg viewBox="0 0 24 24" fill="currentColor" id="npPlayIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button onclick="nextTrack()" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l10 6-10 6z"/></svg></button>
    </div>
    <div class="np-volume">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M16 8a5 5 0 0 1 0 8"></path></svg>
      <input type="range" id="npVolume" min="0" max="1" step="0.01" value="1">
    </div>
  </div>
</div>

<div id="pdfOverlay">
  <div class="pdf-bar">
    <button class="icon-btn" onclick="closePdf()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div class="pdf-bar-mid">
      <img class="pdf-bar-cover" id="pdfBarCover" style="display:none;">
      <div>
        <div class="pdf-bar-title" id="pdfTitle">—</div>
        <div class="pdf-bar-sub" id="pdfSub">—</div>
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" onclick="openEditManualModal()" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></button>
      <button class="icon-btn" onclick="deleteCurrentPdf()" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    </div>
  </div>

<script>
/* ============================= DEBUG CONSOLE ============================= */
// iPads have no way to see console output, so this captures it into an on-screen panel
// you can pop open with the top-right button — install this before anything else runs
// so it catches errors from the very first line.
const debugLog = [];
let debugConsoleOpen = false;
function formatDebugArg(a) {
  if (typeof a === 'string') return a;
  if (a instanceof Error) return a.message;
  try { return JSON.stringify(a); } catch (e) { return String(a); }
}
function pushDebugLog(level, args) {
  debugLog.push({ level, time: new Date(), msg: args.map(formatDebugArg).join(' ') });
  if (debugLog.length > 400) debugLog.shift();
  if (level !== 'log') document.getElementById('debugToggle') && document.getElementById('debugToggle').classList.add('has-errors');
  if (debugConsoleOpen) renderDebugConsole();
}
['log', 'warn', 'error'].forEach(level => {
  const orig = console[level] ? console[level].bind(console) : () => {};
  console[level] = (...args) => { orig(...args); pushDebugLog(level, args); };
});
window.addEventListener('error', (e) => pushDebugLog('error', [`Uncaught: ${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno})`]));
window.addEventListener('unhandledrejection', (e) => pushDebugLog('error', ['Unhandled promise rejection: ' + formatDebugArg(e.reason)]));

function toggleDebugConsole() {
  debugConsoleOpen = !debugConsoleOpen;
  document.getElementById('debugConsole').classList.toggle('open', debugConsoleOpen);
  if (debugConsoleOpen) {
    document.getElementById('debugToggle').classList.remove('has-errors');
    renderDebugConsole();
  }
}
function clearDebugLog() {
  debugLog.length = 0;
  renderDebugConsole();
}
function renderDebugConsole() {
  const el = document.getElementById('debugList');
  if (!el) return;
  if (!debugLog.length) {
    el.innerHTML = '<div class="debug-line" style="color:var(--text-dim);">Nothing logged yet.</div>';
    return;
  }
  el.innerHTML = debugLog.map(entry =>
    `<div class="debug-line ${entry.level}"><span class="debug-time">${entry.time.toLocaleTimeString()}</span>${escapeHtml(entry.msg)}</div>`
  ).join('');
  el.scrollTop = el.scrollHeight;
}

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ============================= IndexedDB layer (never throws) ============================= */
const DB_NAME = 'brickAndSound';
const DB_VERSION = 3;
let db;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('manuals')) d.createObjectStore('manuals', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('tracks')) d.createObjectStore('tracks', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('playlists')) d.createObjectStore('playlists', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('legoSets')) d.createObjectStore('legoSets', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}
function tx(store, mode='readonly') { return db.transaction(store, mode).objectStore(store); }
function dbGetAll(store) {
  return new Promise((resolve) => {
    try {
      const req = tx(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = (e) => { console.warn('dbGetAll failed', store, e); resolve([]); };
    } catch (err) { console.warn('dbGetAll threw', err); resolve([]); }
  });
}
function dbGet(store, key) {
  return new Promise((resolve) => {
    try {
      const req = tx(store).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = (e) => { console.warn('dbGet failed', store, e); resolve(null); };
    } catch (err) { console.warn('dbGet threw', err); resolve(null); }
  });
}
function setMeta(key, value) { return dbPut('meta', { key, value }); }
async function getMeta(key, fallback) {
  const rec = await dbGet('meta', key);
  return rec ? rec.value : fallback;
}
function dbPut(store, val) {
  return new Promise((resolve) => {
    try {
      const req = tx(store, 'readwrite').put(val);
      req.onsuccess = () => resolve(true);
      req.onerror = (e) => { console.warn('dbPut failed', store, e); resolve(false); };
    } catch (err) { console.warn('dbPut threw', err); resolve(false); }
  });
}
function dbDelete(store, id) {
  return new Promise((resolve) => {
    try {
      const req = tx(store, 'readwrite').delete(id);
      req.onsuccess = () => resolve(true);
      req.onerror = (e) => { console.warn('dbDelete failed', store, e); resolve(false); };
    } catch (err) { console.warn('dbDelete threw', err); resolve(false); }
  });
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function readAsDataURL(file) {

    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================= State ============================= */
let manuals = [];
let tracks = [];
let playlists = [];
let legoSets = [];
let soundSeg = 'albums';
let legoSeg = 'all';
let currentQueue = [];
let currentIndex = -1;
let currentPdf = null;
let currentPdfObjectUrl = null;
let pendingManualFiles = [];
let pendingCoverDataUrl = null;
let pendingSetCoverDataUrl = null;
let restoringPlayback = false;

(async function boot() {
  await openDB();
  manuals = await dbGetAll('manuals');
  tracks = await dbGetAll('tracks');
  playlists = await dbGetAll('playlists');
  legoSets = await dbGetAll('legoSets');
  // migrate older records so every field this version relies on actually exists
  tracks.forEach(t => { if (t.favorite === undefined) t.favorite = false; if (!t.tags) t.tags = []; });
  legoSets.forEach(s => { if (s.theme === undefined) s.theme = ''; });

  const savedMode = await getMeta('lastMode', 'build');
  soundSeg = await getMeta('lastSoundSeg', 'albums');
  legoSeg = await getMeta('lastLegoSeg', 'all');
  const savedVolume = await getMeta('volume', 1);

  renderBuild();
  setSoundSeg(soundSeg);
  setLegoSeg(legoSeg);
  setMode(savedMode);

  audioEl.volume = savedVolume;
  document.getElementById('npVolume').value = savedVolume;
  await restorePlaybackState();

  tryAutoMergeBackupFile(); // fire-and-forget: silently no-ops if there's no backup.json
})();

async function restorePlaybackState() {
  const saved = await getMeta('playbackState', null);
  if (!saved || !saved.queueIds || !saved.queueIds.length) return;
  const restoredQueue = saved.queueIds.map(id => tracks.find(t => t.id === id)).filter(Boolean);
  if (!restoredQueue.length) return;
  const idx = Math.min(saved.index || 0, restoredQueue.length - 1);
  restoringPlayback = true;
  currentQueue = restoredQueue;
  currentIndex = idx;
  loadCurrentTrack(false);
  const targetTime = saved.currentTime || 0;
  audioEl.addEventListener('loadedmetadata', function onMeta() {
    audioEl.currentTime = Math.min(targetTime, audioEl.duration || targetTime);
    audioEl.removeEventListener('loadedmetadata', onMeta);
    restoringPlayback = false;
  });
}

function setMode(mode) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('view-build').classList.toggle('active', mode === 'build');
  document.getElementById('view-sound').classList.toggle('active', mode === 'sound');
  document.getElementById('view-collection').classList.toggle('active', mode === 'collection');
  setMeta('lastMode', mode);
}

/* ============================= BUILD: PDF manuals ============================= */
document.getElementById('pdfInput').addEventListener('change', (e) => {
  pendingManualFiles = Array.from(e.target.files);
  e.target.value = '';
  if (pendingManualFiles.length) processNextManual();
});

function processNextManual() {
  if (pendingManualFiles.length === 0) { renderBuild(); return; }
  const file = pendingManualFiles[0];
  pendingCoverDataUrl = null;
  const defaultName = file.name.replace(/\.pdf$/i, '');
  const remaining = pendingManualFiles.length - 1;
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h3>Name this set</h3>
    <div class="modal-note">${escapeHtml(file.name)}</div>
    ${remaining > 0 ? `<div class="queue-note">${remaining} more PDF${remaining === 1 ? '' : 's'} after this one</div>` : ''}
    <div class="field"><label>Name</label><input id="manualNameInput" value="${escapeHtml(defaultName)}" placeholder="e.g. Millennium Falcon"></div>
    <div class="field"><label>Set number (optional)</label><input id="manualSetInput" placeholder="e.g. 75192"></div>
    <div class="field"><label>Booklet size</label>${pageSizeSelectHtml('letter')}</div>
    <div class="field">
      <label>Banner image (optional)</label>
      <div class="cover-picker">
        <div class="cover-preview" id="coverPreview"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg></div>
        <button class="btn ghost" type="button" onclick="document.getElementById('coverInput').click()">Choose photo</button>
        <input type="file" id="coverInput" accept="image/*">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="skipPendingManual()">Skip</button>
      <button class="btn" onclick="savePendingManual()">${remaining > 0 ? 'Save & next' : 'Save'}</button>
    </div>
  `;
  document.getElementById('coverInput').addEventListener('change', async (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    pendingCoverDataUrl = await readAsDataURL(f);
    document.getElementById('coverPreview').innerHTML = `<img src="${pendingCoverDataUrl}">`;
  });
  document.getElementById('modalBackdrop').classList.add('active');
  setTimeout(() => document.getElementById('manualNameInput').focus(), 50);
}
async function savePendingManual() {
  const file = pendingManualFiles.shift();
  const name = document.getElementById('manualNameInput').value.trim() || file.name.replace(/\.pdf$/i, '');
  const setNumber = document.getElementById('manualSetInput').value.trim();
  const pageSize = document.getElementById('manualSizeInput').value;
  const manual = { id: uid(), name, setNumber, pageSize, blob: file, cover: pendingCoverDataUrl || null };
  manuals.push(manual);
  renderBuild();
  closeModal();
  dbPut('manuals', manual);
  if (pendingManualFiles.length) processNextManual();
}
function skipPendingManual() {
  pendingManualFiles.shift();
  closeModal();
  if (pendingManualFiles.length) processNextManual(); else renderBuild();
}

function renderBuild() {
  const grid = document.getElementById('buildGrid');
  const existingEmpty = grid.parentElement.querySelector('.empty-state');
  if (existingEmpty) existingEmpty.remove();
  document.getElementById('buildSub').textContent = manuals.length
    ? `${manuals.length} manual${manuals.length === 1 ? '' : 's'} in your library`
    : 'Your Lego manuals, ready to build from';
  grid.innerHTML = '';
  manuals.forEach(m => {
    const tile = document.createElement('button');
    tile.className = 'tile';
    tile.onclick = () => openPdf(m.id);
    tile.innerHTML = `
      <div class="tile-art brick-art">
        ${m.cover ? `<img src="${m.cover}">` : `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>`}
      </div>
      <div class="tile-name">${escapeHtml(m.name)}</div>
      <div class="tile-meta">${m.setNumber ? 'Set ' + escapeHtml(m.setNumber) : 'Lego instructions'}${m.pageSize && m.pageSize !== 'letter' ? ' · ' + escapeHtml(PDF_PAGE_SIZES[m.pageSize].label.split(' (')[0]) : ''}${m.lastPage > 1 ? ' · p.' + m.lastPage : ''}</div>
    `;
    grid.appendChild(tile);
  });
  const addTile = document.createElement('button');
  addTile.className = 'tile add-tile';
  addTile.onclick = () => document.getElementById('pdfInput').click();
  addTile.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`;
  grid.appendChild(addTile);
  if (manuals.length === 0) {
    grid.insertAdjacentHTML('beforebegin', emptyStateHtml('No instructions yet.', 'Tap "Add PDF" and pick a Lego instruction booklet — you\'ll get to name it and pick a banner photo, then it shows up here as a tile.'));
  }
}

async function openPdf(id) {
  const manual = manuals.find(m => m.id === id);
  if (!manual) return;
  document.getElementById('pdfTitle').textContent = manual.name;
  document.getElementById('pdfSub').textContent = 'Loading…';
  const cover = document.getElementById('pdfBarCover');
  if (manual.cover) { cover.src = manual.cover; cover.style.display = 'block'; } else { cover.style.display = 'none'; }
  const overlay = document.getElementById('pdfOverlay');
  overlay.classList.add('active');
  showPdfControls();
  if (overlay.requestFullscreen) { overlay.requestFullscreen().catch(() => {}); }
  try {
    if (currentPdfObjectUrl) { URL.revokeObjectURL(currentPdfObjectUrl); currentPdfObjectUrl = null; }
    let doc;
    try {
      // Loading from an object URL lets pdf.js stream the file instead of pulling the
      // whole thing into memory at once — better for big Lego manuals.
      currentPdfObjectUrl = URL.createObjectURL(manual.blob);
      doc = await pdfjsLib.getDocument({ url: currentPdfObjectUrl }).promise;
    } catch (streamErr) {
      // Some environments block fetching blob: URLs from pdf.js's worker entirely
      // (that's what the "Unexpected server response (0)" error means). When that
      // happens, fall back to just handing pdf.js the raw bytes directly instead.
      console.warn('Streamed PDF load failed, falling back to direct load', streamErr);
      if (currentPdfObjectUrl) { URL.revokeObjectURL(currentPdfObjectUrl); currentPdfObjectUrl = null; }
      const arrayBuf = await manual.blob.arrayBuffer();
      doc = await pdfjsLib.getDocument({ data: arrayBuf }).promise;
    }
    const resumePage = Math.min(Math.max(manual.lastPage || 1, 1), doc.numPages);
    currentPdf = { manualId: id, doc, pageNum: resumePage };
    document.getElementById('pdfSub').textContent = `${doc.numPages} page${doc.numPages === 1 ? '' : 's'}${manual.setNumber ? ' · Set ' + manual.setNumber : ''}`;
    renderPdfPage();
  } catch (err) {
    document.getElementById('pdfSub').textContent = 'Could not open this PDF — it may be too large or damaged';
    console.warn(err);
  }
}
async function renderPdfPage() {
  if (!currentPdf) return;
  const canvas = document.getElementById('pdfCanvas');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('pdfCanvasWrap');
  document.getElementById('pdfPageIndicator').textContent = `Page ${currentPdf.pageNum} / ${currentPdf.doc.numPages}`;
  const manual = manuals.find(m => m.id === currentPdf.manualId);
  const preset = PDF_PAGE_SIZES[manual && manual.pageSize] || PDF_PAGE_SIZES.letter;
  try {
    const page = await currentPdf.doc.getPage(currentPdf.pageNum);
    const unscaled = page.getViewport({ scale: 1 });
    // Fit the *entire* page inside the visible area at once — no scrolling to see the
    // rest of it — while capping resolution based on the booklet size you picked, so a
    // tiny leaflet doesn't get asked to render at poster size (and a huge UCS manual
    // still gets enough pixels to read the fine print) without overloading Safari.
    const dpiCapW = preset.w * 220;
    const dpiCapH = preset.h * 220;
    const availWidth = Math.max(wrap.clientWidth - 24, 240);
    const availHeight = Math.max(wrap.clientHeight - 24, 240);
    const scale = Math.min(availWidth / unscaled.width, availHeight / unscaled.height, dpiCapW / unscaled.width, dpiCapH / unscaled.height);
    const viewport = page.getViewport({ scale });
    canvas.width = Math.round(viewport.width);
    canvas.height = Math.round(viewport.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    if (manual && manual.lastPage !== currentPdf.pageNum) {
      manual.lastPage = currentPdf.pageNum;
      dbPut('manuals', manual);
    }
  } catch (err) {
    console.warn('Page render failed', err);
    try { ctx.clearRect(0, 0, canvas.width, canvas.height); } catch(e) {}
    document.getElementById('pdfSub').textContent = 'Could not render this page — try the next one';
  }
}
function pdfNextPage() { if (currentPdf && currentPdf.pageNum < currentPdf.doc.numPages) { currentPdf.pageNum++; renderPdfPage(); } showPdfControls(); }
function pdfPrevPage() { if (currentPdf && currentPdf.pageNum > 1) { currentPdf.pageNum--; renderPdfPage(); } showPdfControls(); }
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('pdfOverlay').classList.contains('active')) return;
  if (e.key === 'ArrowRight') pdfNextPage();
  if (e.key === 'ArrowLeft') pdfPrevPage();
  if (e.key === 'Escape') closePdf();
});
function closePdf() {
  const overlay = document.getElementById('pdfOverlay');
  overlay.classList.remove('active');
  clearTimeout(pdfControlsTimer);
  if (document.fullscreenElement === overlay) { document.exitFullscreen().catch(() => {}); }
  if (currentPdf && currentPdf.doc) { try { currentPdf.doc.destroy(); } catch(e) {} }
  if (currentPdfObjectUrl) { URL.revokeObjectURL(currentPdfObjectUrl); currentPdfObjectUrl = null; }
  currentPdf = null;
}

// Nav/title bars fade out after a few seconds of no interaction so the page fills the
// screen; any tap on the page (or turning a page) brings them right back.
let pdfControlsTimer = null;
function showPdfControls() {

document.getElementById('mp3Input').addEventListener('change', async (e) => {

  e.target.value = '';
  for (const file of files) {
    const id = uid();
    const guess = file.name.replace(/\.(mp3|m4a|wav|aac|ogg)$/i, '');
    const track = { id, title: guess, artist: '', album: 'Unsorted', genre: 'Unsorted', tags: [], favorite: false, blob: file };

    dbPut('tracks', track);

function setSoundSeg(seg) {
  soundSeg = seg;
  document.querySelectorAll('#soundSeg button').forEach(b => b.classList.toggle('active', b.dataset.seg === seg));
  renderSound();
  setMeta('lastSoundSeg', seg);
}
function renderSound() {
  const el = document.getElementById('soundScroll');
  el.innerHTML = '';
  if (soundSeg === 'albums') renderCategoryGrid(el, 'album', 'album-art', 'No albums yet.', 'Add some songs, then use the pencil on a track to sort it into an album.');
  else if (soundSeg === 'artists') renderCategoryGrid(el, 'artist', 'artist-art', 'No artists yet.', 'Use the pencil on a track to fill in the artist.');
  else if (soundSeg === 'genres') renderCategoryGrid(el, 'genre', 'genre-art', 'No genres yet.', 'Use the pencil on a track to tag it with a genre — Rap, Rock, whatever fits.');

  else if (soundSeg === 'favorites') renderFlatList(el, tracks.filter(t => t.favorite), 'No favorites yet.', 'Tap the star on any song to pin it here.');

function groupIcon(kind) {
  if (kind === 'album-art') return `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.4" fill="#fff" stroke="none"></circle></svg>`;
  if (kind === 'artist-art') return `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M12 14a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v4.5A3.5 3.5 0 0 0 12 14Z"></path><path d="M6 11a6 6 0 0 0 12 0M12 17v3"></path></svg>`;
  if (kind === 'genre-art') return `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`;
  if (kind === 'tag-art') return `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M20.6 12.6 12 21.2a2 2 0 0 1-2.8 0l-6.4-6.4a2 2 0 0 1 0-2.8L11.4 3.4a2 2 0 0 1 1.4-.6H19a2 2 0 0 1 2 2v5.8a2 2 0 0 1-.4 1.4Z"></path><circle cx="16.5" cy="7.5" r="1.5" fill="#fff" stroke="none"></circle></svg>`;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="#241c00" stroke-width="1.8"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`;
}

function trackKeysFor(t, type) {
  if (type === 'tags') return (t.tags && t.tags.length) ? t.tags : ['Untagged'];
  const val = (t[type] || 'Unsorted').trim();
  return [val || 'Unsorted'];
}

function renderCategoryGrid(el, type, artClass, emptyTitle, emptyBody) {
  const map = {};
  tracks.forEach(t => { trackKeysFor(t, type).forEach(key => { (map[key] ||= []).push(t); }); });
  const unsortedLabel = type === 'tags' ? 'Untagged' : 'Unsorted';
  const names = Object.keys(map).sort((a,b) => a === unsortedLabel ? 1 : b === unsortedLabel ? -1 : a.localeCompare(b));
  if (names.length === 0) { el.innerHTML = emptyStateHtml(emptyTitle, emptyBody); return; }
  const grid = document.createElement('div');
  grid.className = 'tile-grid';
  names.forEach(name => {
    const list = map[name];
    const tile = document.createElement('button');
    tile.className = 'tile';
    tile.onclick = () => openCategoryDetail(type, name, artClass);
    tile.innerHTML = `
      <div class="tile-art ${artClass}">${groupIcon(artClass)}</div>
      <div class="tile-name">${escapeHtml(name)}</div>
      <div class="tile-meta">${list.length} song${list.length === 1 ? '' : 's'}</div>
    `;
    grid.appendChild(tile);
  });
  el.appendChild(grid);
}

function openCategoryDetail(type, name, artClass) {
  const el = document.getElementById('soundScroll');
  el.innerHTML = '';
  const back = document.createElement('button');
  back.className = 'btn ghost back-btn';
  back.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back`;
  back.onclick = () => renderSound();
  el.appendChild(back);

  const list = tracks.filter(t => trackKeysFor(t, type).includes(name));
  const heading = document.createElement('div');
  heading.style.cssText = 'display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap: 12px; flex-wrap: wrap;';
  heading.innerHTML = `<h2 style="font-family:var(--font-display); margin:0; font-size:22px;">${escapeHtml(name)}</h2>`;
  const playAllBtn = document.createElement('button');
  playAllBtn.className = 'btn teal';
  playAllBtn.textContent = 'Play all';
  playAllBtn.onclick = () => playQueue(list, 0);
  heading.appendChild(playAllBtn);
  el.appendChild(heading);
  list.forEach((t, i) => el.appendChild(trackRow(t, i, list)));
}

function renderPlaylists(el) {
  if (playlists.length === 0) { el.innerHTML = emptyStateHtml('No playlists yet.', 'Tap "New playlist" up top to start one.'); return; }
  const grid = document.createElement('div');
  grid.className = 'tile-grid';
  playlists.forEach(pl => {
    const plTracks = pl.trackIds.map(id => tracks.find(t => t.id === id)).filter(Boolean);
    const tile = document.createElement('button');
    tile.className = 'tile';
    tile.onclick = () => openPlaylistDetail(pl.id);
    tile.innerHTML = `
      <div class="tile-art playlist-art">${groupIcon('playlist-art')}</div>
      <div class="tile-name">${escapeHtml(pl.name)}</div>
      <div class="tile-meta">${plTracks.length} song${plTracks.length === 1 ? '' : 's'}</div>
    `;
    grid.appendChild(tile);
  });
  el.appendChild(grid);
}

function openPlaylistDetail(id) {
  const pl = playlists.find(p => p.id === id);
  if (!pl) return;
  const el = document.getElementById('soundScroll');
  el.innerHTML = '';
  const back = document.createElement('button');
  back.className = 'btn ghost back-btn';
  back.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> All playlists`;
  back.onclick = () => renderSound();
  el.appendChild(back);

  const plTracks = pl.trackIds.map(tid => tracks.find(t => t.id === tid)).filter(Boolean);
  const heading = document.createElement('div');
  heading.style.cssText = 'display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap: 12px; flex-wrap: wrap;';
  heading.innerHTML = `<h2 style="font-family:var(--font-display); margin:0; font-size:22px;">${escapeHtml(pl.name)}</h2>`;
  const playAllBtn = document.createElement('button');
  playAllBtn.className = 'btn teal';
  playAllBtn.textContent = 'Play all';
  playAllBtn.disabled = plTracks.length === 0;
  playAllBtn.onclick = () => { if (plTracks.length) playQueue(plTracks, 0); };
  heading.appendChild(playAllBtn);
  el.appendChild(heading);

  if (plTracks.length === 0) {
    el.insertAdjacentHTML('beforeend', emptyStateHtml('No songs in this playlist yet.', 'Go to "All songs", tap the + on a track, and add it here.'));
  }
  plTracks.forEach((t, i) => {
    const row = trackRow(t, i, plTracks);
    const removeBtn = document.createElement('button');
    removeBtn.title = 'Remove from playlist';
    removeBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
    removeBtn.onclick = (e) => { e.stopPropagation(); pl.trackIds = pl.trackIds.filter(x => x !== t.id); dbPut('playlists', pl); openPlaylistDetail(id); };
    row.querySelector('.track-actions').appendChild(removeBtn);
    el.appendChild(row);
  });
}

function renderFlatList(el, list, emptyTitle, emptyBody) {
  if (list.length === 0) { el.innerHTML = emptyStateHtml(emptyTitle, emptyBody); return; }
  list.forEach((t, i) => el.appendChild(trackRow(t, i, list)));
}

function trackRow(t, index, queueRef) {
  const row = document.createElement('div');
  row.className = 'track-row' + (currentQueue[currentIndex] === t ? ' playing' : '');
  row.onclick = () => playQueue(queueRef, index);

  row.innerHTML = `
    <div class="track-num">${index + 1}</div>
    <div class="track-art"></div>
    <div style="min-width:0; flex:1;">
      <div class="track-title">${escapeHtml(t.title)}</div>

    </div>
    <div class="track-actions">
      <button title="Favorite" class="fav-btn">${t.favorite ? starIcon(true) : starIcon(false)}</button>

  `;

function starIcon(filled) {

      <datalist id="albumOptions">${albumOptions.map(a => `<option value="${escapeHtml(a)}">`).join('')}</datalist>
    </div>

    </div>

      <datalist id="tagOptions">${tagOptions.map(g => `<option value="${escapeHtml(g)}">`).join('')}</datalist>

async function saveTrackEdit(trackId) {
  const t = tracks.find(x => x.id === trackId);
  if (!t) return;
  t.title = document.getElementById('trackTitleInput').value.trim() || t.title;
  t.artist = document.getElementById('trackArtistInput').value.trim();
  t.album = document.getElementById('trackAlbumInput').value.trim() || 'Unsorted';
  t.genre = document.getElementById('trackGenreInput').value.trim() || 'Unsorted';
  t.tags = document.getElementById('trackTagsInput').value.split(',').map(s => s.trim()).filter(Boolean);

function setLegoSeg(seg) {
  legoSeg = seg;

  renderCollection();
  setMeta('lastLegoSeg', seg);

function makeSetTile(s) {
  const tile = document.createElement('div');
  tile.className = 'set-tile' + (s.status === 'wishlist' ? ' is-wishlist' : '');
  tile.onclick = () => openEditSetModal(s.id);
  const metaBits = [s.setNum ? '#' + s.setNum : null, s.pieces ? Number(s.pieces).toLocaleString() + ' pcs' : null, s.price ? '$' + Number(s.price).toFixed(0) : null, s.theme || null].filter(Boolean).join(' · ');
  tile.innerHTML = `
    <div class="set-art">${s.cover ? `<img src="${s.cover}">` : `<div class="stud-dot"></div><div class="stud-dot"></div><div class="stud-dot"></div>`}</div>
    <div class="set-name">${escapeHtml(s.name)}</div>
    <div class="set-meta">${metaBits}</div>
    <span class="set-status-pill ${s.status}">${s.status === 'wishlist' ? 'Wishlist' : s.status === 'building' ? 'Building' : 'Built'}</span>
  `;
  if (s.status === 'wishlist') {
    const b = document.createElement('button');
    b.className = 'set-quick-btn gotit';
    b.textContent = 'Got it!';
    b.onclick = (e) => { e.stopPropagation(); s.status = 'building'; dbPut('legoSets', s); renderCollection(); };
    tile.appendChild(b);
  } else if (s.status === 'building') {
    const b = document.createElement('button');
    b.className = 'set-quick-btn built';
    b.textContent = 'Mark built';
    b.onclick = (e) => { e.stopPropagation(); s.status = 'built'; dbPut('legoSets', s); renderCollection(); };
    tile.appendChild(b);
  }
  return tile;
}

function renderCollection() {
  const built = legoSets.filter(s => s.status === 'built');
  const building = legoSets.filter(s => s.status === 'building');
  const wish = legoSets.filter(s => s.status === 'wishlist');
  document.getElementById('legoBuiltCount').textContent = built.length;
  document.getElementById('legoPieceCount').textContent = built.concat(building).reduce((sum, s) => sum + (Number(s.pieces) || 0), 0).toLocaleString();
  document.getElementById('legoWishCount').textContent = wish.length;
  document.getElementById('legoWishValue').textContent = '$' + wish.reduce((sum, s) => sum + (Number(s.price) || 0), 0).toFixed(0);

  const spot = document.getElementById('legoSpotlight');
  if (building.length) {
    const s = building[0];
    spot.classList.add('show');
    spot.innerHTML = `
      ${s.cover ? `<img class="spotlight-art" src="${s.cover}">` : `<div class="spotlight-art"></div>`}
      <div>
        <div class="spotlight-eyebrow">Currently building</div>
        <div class="spotlight-title">${escapeHtml(s.name)}</div>
        <div class="spotlight-sub">${s.pieces ? Number(s.pieces).toLocaleString() + ' pieces' : 'Piece count not set'}</div>
      </div>`;
  } else {
    spot.classList.remove('show');
    spot.innerHTML = '';
  }

  const grid = document.getElementById('legoGrid');
  const label = document.getElementById('legoSectionLabel');
  const existingEmpty = grid.parentElement.querySelector('.empty-state');
  if (existingEmpty) existingEmpty.remove();
  grid.innerHTML = '';

  if (legoSeg === 'theme') {
    label.textContent = 'BY THEME';
    const map = {};
    legoSets.forEach(s => { const key = (s.theme || 'No theme').trim() || 'No theme'; (map[key] ||= []).push(s); });
    const names = Object.keys(map).sort((a,b) => a === 'No theme' ? 1 : b === 'No theme' ? -1 : a.localeCompare(b));
    if (names.length === 0) { grid.insertAdjacentHTML('beforebegin', emptyStateHtml('No sets yet.', 'Tap "Add set" to log something you\'re building, have built, or want next.')); return; }
    names.forEach(name => {
      const group = document.createElement('div');
      group.style.cssText = 'grid-column: 1 / -1; display:flex; flex-direction:column; gap:12px; margin-bottom: 6px;';
      const sub = document.createElement('div');
      sub.style.cssText = 'font-family: var(--font-display); font-weight:700; font-size:15px; color: var(--yellow);';
      sub.textContent = name;
      const subGrid = document.createElement('div');
      subGrid.className = 'tile-grid';
      map[name].forEach(s => subGrid.appendChild(makeSetTile(s)));
      group.appendChild(sub);
      group.appendChild(subGrid);
      grid.appendChild(group);
    });
    return;
  }

  label.textContent = legoSeg === 'all' ? 'THE COLLECTION' : legoSeg.toUpperCase();
  const list = legoSeg === 'all' ? legoSets : legoSets.filter(s => s.status === legoSeg);
  if (list.length === 0) {
    grid.insertAdjacentHTML('beforebegin', emptyStateHtml('Nothing here yet.', legoSeg === 'all' ? 'Tap "Add set" to log something you\'re building, have built, or want next.' : 'Sets you mark this way will show up here.'));
    return;
  }
  list.forEach(s => grid.appendChild(makeSetTile(s)));
}

/* ============================= BACKUP & RESTORE ============================= */
// A full backup bundles every manual, song, playlist, and Lego set — including the
// actual PDF/audio files and photos, not just metadata — into one JSON file you save
// to Files. Re-importing it (here or on a fresh install) restores everything. If a file
// named "backup.json" sits next to this page's own file on your server, it's loaded
// automatically on startup and merged in — so if you export your library and commit
// that file alongside index.html, any new install (or a future update) will auto-fill
// itself back in without you doing anything else.
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
async function dataUrlToBlob(dataUrl) {
  const res = await fetch(dataUrl);
  return await res.blob();
}
function stripBlob(obj) {
  const copy = { ...obj };
  delete copy.blob;
  return copy;
}

function openBackupModal() {
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h3>Backup &amp; restore</h3>
    <div class="modal-note" style="line-height:1.6;">
      Export bundles everything — manuals, songs, playlists, Lego sets, photos and all — into one file you save to Files. Big libraries (lots of manuals especially) can take a minute and make a large file; that's normal.
    </div>
    <div class="modal-actions" style="justify-content:flex-start; flex-wrap:wrap;">
      <button class="btn teal" onclick="exportBackup()">Export backup</button>
      <button class="btn ghost" onclick="document.getElementById('backupImportInput').click()">Import backup</button>
    </div>
    <div class="modal-note" style="line-height:1.6; margin-top:16px;">
      Importing merges into what's already here — anything with a matching ID gets overwritten with the version from the file, everything else stays untouched.
    </div>
    <div class="modal-note" style="line-height:1.6; margin-top:10px;">
      Want new installs to auto-fill themselves? Export, rename the file to exactly <b>backup.json</b>, and commit it into your GitHub repo next to index.html. It'll be checked and merged in (without overwriting anything you've already changed locally) every time the app starts fresh.
    </div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Close</button></div>
  `;
  document.getElementById('modalBackdrop').classList.add('active');
}

async function exportBackup() {
  const body = document.getElementById('modalBody');
  const total = manuals.length + tracks.length || 1;
  let done = 0;
  const setProgress = () => {
    done++;
    const note = document.getElementById('exportProgressNote');
    if (note) note.textContent = `Packing files… ${done} / ${total}`;
  };
  body.innerHTML = `<h3>Exporting…</h3><div class="modal-note" id="exportProgressNote">Packing files… 0 / ${total}</div>`;

  const manualsOut = [];
  for (const m of manuals) {
    const blobDataUrl = await blobToDataURL(m.blob);
    manualsOut.push({ ...stripBlob(m), blobDataUrl });
    setProgress();
  }
  const tracksOut = [];
  for (const t of tracks) {
    const blobDataUrl = await blobToDataURL(t.blob);
    tracksOut.push({ ...stripBlob(t), blobDataUrl });
    setProgress();
  }

  const payload = {
    version: 1,
    app: 'brick-and-sound',
    exportedAt: new Date().toISOString(),
    manuals: manualsOut,
    tracks: tracksOut,
    playlists,
    legoSets
  };
  const json = JSON.stringify(payload);
  const fileBlob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(fileBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `brick-and-sound-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);

  body.innerHTML = `
    <h3>Backup ready</h3>
    <div class="modal-note" style="line-height:1.6;">Your download should be starting (or offering a Save sheet) now — ${manualsOut.length} manual${manualsOut.length === 1 ? '' : 's'} and ${tracksOut.length} song${tracksOut.length === 1 ? '' : 's'} packed in, plus every playlist and Lego set.</div>
    <div class="modal-actions"><button class="btn teal" onclick="closeModal()">Done</button></div>
  `;
}

document.getElementById('backupImportInput').addEventListener('change', async (e) => {

async function importBackupFile(file) {
  const body = document.getElementById('modalBody');
  body.innerHTML = `<h3>Restoring…</h3><div class="modal-note">Reading backup file…</div>`;
  document.getElementById('modalBackdrop').classList.add('active');
  let payload;
  try {
    const text = await file.text();
    payload = JSON.parse(text);
  } catch (err) {
    console.error('Backup file could not be read: ' + err.message);
    body.innerHTML = `<h3>Couldn't read that file</h3><div class="modal-note">It doesn't look like a valid backup. Make sure you picked a file this app exported.</div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Close</button></div>`;
    return;
  }
  const result = await mergeBackupPayload(payload, { overwrite: true, progressEl: 'modalBody' });
  renderBuild(); renderSound(); renderCollection();
  showImportSummary({
    addedSongs: result.addedTracks, updatedSongs: result.updatedTracks,
    addedManuals: result.addedManuals, updatedManuals: result.updatedManuals,
    addedPlaylists: result.addedPlaylists, skipped: 0
  });
}

async function mergeBackupPayload(payload, opts) {
  const overwrite = !!(opts && opts.overwrite);
  const result = { addedManuals: 0, updatedManuals: 0, addedTracks: 0, updatedTracks: 0, addedPlaylists: 0, updatedPlaylists: 0, addedSets: 0, updatedSets: 0 };

  for (const m of (payload.manuals || [])) {
    const existingIdx = manuals.findIndex(x => x.id === m.id);
    if (existingIdx !== -1 && !overwrite) continue;
    try {
      const blob = await dataUrlToBlob(m.blobDataUrl);
      const rec = { ...m, blob };
      delete rec.blobDataUrl;
      if (existingIdx !== -1) { manuals[existingIdx] = rec; result.updatedManuals++; }
      else { manuals.push(rec); result.addedManuals++; }
      await dbPut('manuals', rec);
    } catch (err) { console.warn('Skipped a manual in backup: ' + err.message); }
  }

  for (const t of (payload.tracks || [])) {
    const existingIdx = tracks.findIndex(x => x.id === t.id);
    if (existingIdx !== -1 && !overwrite) continue;
    try {
      const blob = await dataUrlToBlob(t.blobDataUrl);
      const rec = { ...t, blob };
      delete rec.blobDataUrl;
      if (existingIdx !== -1) { tracks[existingIdx] = rec; result.updatedTracks++; }
      else { tracks.push(rec); result.addedTracks++; }
      await dbPut('tracks', rec);
    } catch (err) { console.warn('Skipped a song in backup: ' + err.message); }
  }

  for (const p of (payload.playlists || [])) {
    const existingIdx = playlists.findIndex(x => x.id === p.id);
    if (existingIdx !== -1 && !overwrite) continue;
    if (existingIdx !== -1) { playlists[existingIdx] = p; result.updatedPlaylists++; }
    else { playlists.push(p); result.addedPlaylists++; }
    await dbPut('playlists', p);
  }

  for (const s of (payload.legoSets || [])) {
    const existingIdx = legoSets.findIndex(x => x.id === s.id);
    if (existingIdx !== -1 && !overwrite) continue;
    if (existingIdx !== -1) { legoSets[existingIdx] = s; result.updatedSets++; }
    else { legoSets.push(s); result.addedSets++; }
    await dbPut('legoSets', s);
  }

  return result;
}

async function tryAutoMergeBackupFile() {
  try {
    const res = await fetch('./backup.json', { cache: 'no-store' });
    if (!res.ok) return;
    const payload = await res.json();
    const result = await mergeBackupPayload(payload, { overwrite: false });
    const totalAdded = result.addedManuals + result.addedTracks + result.addedPlaylists + result.addedSets;
    if (totalAdded > 0) {
      console.log(`Auto-loaded ${totalAdded} item(s) from backup.json`);
      renderBuild(); renderSound(); renderCollection();
    }
  } catch (err) {
    // No backup.json next to this page, or it couldn't be fetched — perfectly normal, stay silent.
  }
}

/* ============================= BATCH IMPORT (multi-file picker) ============================= */
// Safari on iPhone/iPad has no way to pick an entire folder (no directory picker, and
// no filesystem write access either) — only individual files, picked from one Files-app
// folder view at a time. So instead of pretending we can read a whole folder tree, this
// lets you multi-select a batch of files (everything inside one folder, like
// "genres/Rap") and tag the whole batch in one go instead of editing each song by hand.
const AUDIO_EXT = /\.(mp3|m4a|wav|aac|ogg|flac|caf)$/i;
let pendingBatchFiles = [];
let pendingBatchPdfStats = null;

document.getElementById('folderImportInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  e.target.value = '';
  if (files.length) await handleBatchImport(files);
});

async function handleBatchImport(files) {
  const audioFiles = [];
  const pdfFiles = [];
  let skipped = 0;
  for (const file of files) {
    if (/\.pdf$/i.test(file.name)) pdfFiles.push(file);
    else if (AUDIO_EXT.test(file.name)) audioFiles.push(file);
    else skipped++;
  }

  let addedManuals = 0, updatedManuals = 0;
  for (const file of pdfFiles) {
    const key = file.name + ':' + file.size;
    let m = manuals.find(x => x._importKey === key);
    if (!m) {
      m = { id: uid(), name: file.name.replace(/\.pdf$/i, ''), setNumber: '', pageSize: 'letter', blob: file, cover: null, _importKey: key };
      manuals.push(m);
      addedManuals++;
    } else {
      m.blob = file;
      updatedManuals++;
    }
    await dbPut('manuals', m);
  }
  if (pdfFiles.length) renderBuild();

  if (audioFiles.length) {
    pendingBatchFiles = audioFiles;
    pendingBatchPdfStats = { addedManuals, updatedManuals, skipped };
    openBatchTagModal(audioFiles.length);
  } else {
    showImportSummary({ addedSongs: 0, updatedSongs: 0, addedManuals, updatedManuals, addedPlaylists: 0, skipped });
  }
}

async function confirmBatchTag() {
  const artist = document.getElementById('batchArtistInput').value.trim();
  const album = document.getElementById('batchAlbumInput').value.trim();
  const genre = document.getElementById('batchGenreInput').value.trim();
  const tagList = document.getElementById('batchTagsInput').value.split(',').map(s => s.trim()).filter(Boolean);
  const favorite = document.getElementById('batchFavoriteInput').checked;
  const plSelect = document.getElementById('batchPlaylistInput').value;
  const stats = pendingBatchPdfStats || { addedManuals: 0, updatedManuals: 0, skipped: 0 };

  let targetPlaylist = null;
  let addedPlaylists = 0;
  if (plSelect === '__new__') {
    const newName = document.getElementById('batchNewPlaylistName').value.trim();
    if (newName) {
      targetPlaylist = { id: uid(), name: newName, trackIds: [] };
      playlists.push(targetPlaylist);
      addedPlaylists++;
    }
  } else if (plSelect) {
    targetPlaylist = playlists.find(p => p.id === plSelect) || null;
  }

  let addedSongs = 0, updatedSongs = 0;
  for (const file of pendingBatchFiles) {
    const key = file.name + ':' + file.size;
    let t = tracks.find(x => x._importKey === key);
    if (!t) {
      t = {
        id: uid(),
        title: file.name.replace(AUDIO_EXT, ''),
        artist: artist || '',
        album: album || 'Unsorted',
        genre: genre || 'Unsorted',
        tags: [...tagList],
        favorite,
        blob: file,
        _importKey: key
      };
      tracks.push(t);
      addedSongs++;
    } else {
      t.blob = file;
      if (artist) t.artist = artist;
      if (album) t.album = album;
      if (genre) t.genre = genre;
      tagList.forEach(tag => { if (!t.tags.includes(tag)) t.tags.push(tag); });
      if (favorite) t.favorite = true;
      updatedSongs++;
    }
    await dbPut('tracks', t);
    if (targetPlaylist && !targetPlaylist.trackIds.includes(t.id)) targetPlaylist.trackIds.push(t.id);
  }
  if (targetPlaylist) await dbPut('playlists', targetPlaylist);

  pendingBatchFiles = [];
  pendingBatchPdfStats = null;
  closeModal();
  renderSound();
  renderBuild();
  showImportSummary({
    addedSongs, updatedSongs,
    addedManuals: stats.addedManuals,
    updatedManuals: stats.updatedManuals,
    addedPlaylists,
    skipped: stats.skipped
  });
}

function showImportSummary({ addedSongs, updatedSongs, addedManuals, updatedManuals, addedPlaylists, skipped }) {
  const lines = [];
  if (addedSongs) lines.push(`${addedSongs} new song${addedSongs === 1 ? '' : 's'} added`);
  if (updatedSongs) lines.push(`${updatedSongs} song${updatedSongs === 1 ? '' : 's'} re-sorted`);
  if (addedManuals) lines.push(`${addedManuals} new manual${addedManuals === 1 ? '' : 's'} added`);
  if (updatedManuals) lines.push(`${updatedManuals} manual${updatedManuals === 1 ? '' : 's'} updated`);
  if (addedPlaylists) lines.push(`${addedPlaylists} new playlist${addedPlaylists === 1 ? '' : 's'} created`);
  if (!lines.length) lines.push('Nothing added.');
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h3>Import complete</h3>
    <div class="modal-note" style="line-height:1.7;">${lines.map(escapeHtml).join('<br>')}${skipped ? `<br>${skipped} file${skipped === 1 ? '' : 's'} skipped (not a song or PDF)` : ''}</div>
    <div class="modal-actions"><button class="btn teal" onclick="closeModal()">Done</button></div>
  `;
  document.getElementById('modalBackdrop').classList.add('active');
}
