/* ============================= Playback ============================= */
const audioEl = document.getElementById('audioEl');
let currentObjectUrl = null;
let lastSavedSecond = -10;

function playQueue(list, startIndex) { currentQueue = list.slice(); currentIndex = startIndex; loadCurrentTrack(true); }
function loadCurrentTrack(autoplay) {
  const t = currentQueue[currentIndex];
  if (!t) return;
  if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
  currentObjectUrl = URL.createObjectURL(t.blob);
  audioEl.src = currentObjectUrl;
  document.getElementById('npTitle').textContent = t.title;
  document.getElementById('npArtist').textContent = [t.artist, t.album].filter(v => v && v !== 'Unsorted').join(' · ') || '—';
  document.getElementById('nowPlaying').classList.add('show');
  if (autoplay) audioEl.play().catch(()=>{});
  updatePlayIcon();
  renderSound();
  if (!restoringPlayback) savePlaybackState(0);
}
function togglePlay() { if (!audioEl.src) return; if (audioEl.paused) audioEl.play(); else audioEl.pause(); }
audioEl.addEventListener('play', updatePlayIcon);
audioEl.addEventListener('pause', () => { updatePlayIcon(); savePlaybackState(); });
function updatePlayIcon() {
  document.getElementById('npPlayIcon').innerHTML = audioEl.paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
}
function nextTrack() { if (currentIndex < currentQueue.length - 1) { currentIndex++; loadCurrentTrack(true); } }
function prevTrack() { if (audioEl.currentTime > 3) { audioEl.currentTime = 0; return; } if (currentIndex > 0) { currentIndex--; loadCurrentTrack(true); } }
audioEl.addEventListener('ended', () => { savePlaybackState(0); nextTrack(); });
audioEl.addEventListener('timeupdate', () => {
  if (!audioEl.duration) return;
  document.getElementById('npSeek').value = (audioEl.currentTime / audioEl.duration) * 100;
  document.getElementById('npCur').textContent = fmtTime(audioEl.currentTime);
  document.getElementById('npDur').textContent = fmtTime(audioEl.duration);
  if (!restoringPlayback && Math.abs(audioEl.currentTime - lastSavedSecond) >= 3) {
    lastSavedSecond = audioEl.currentTime;
    savePlaybackState();
  }
});
document.getElementById('npSeek').addEventListener('input', (e) => { if (audioEl.duration) { audioEl.currentTime = (e.target.value / 100) * audioEl.duration; savePlaybackState(); } });
document.getElementById('npVolume').addEventListener('input', (e) => {
  audioEl.volume = Number(e.target.value);
  setMeta('volume', audioEl.volume);
});
function savePlaybackState(overrideTime) {
  if (!currentQueue.length) return;
  setMeta('playbackState', {
    queueIds: currentQueue.map(t => t.id),
    index: currentIndex,
    currentTime: overrideTime !== undefined ? overrideTime : audioEl.currentTime,
    paused: audioEl.paused
  });
}
window.addEventListener('beforeunload', () => savePlaybackState());
function fmtTime(s) { s = Math.floor(s || 0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

/* ============================= Modals ============================= */
function openPlaylistModal() {
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h3>New playlist</h3>
    <div class="field"><label>Name</label><input id="plNameInput" placeholder="Rainy day builds"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn teal" onclick="createPlaylist()">Create</button>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('active');
  setTimeout(() => document.getElementById('plNameInput').focus(), 50);
}
async function createPlaylist() {
  const name = document.getElementById('plNameInput').value.trim();
  if (!name) return;
  const pl = { id: uid(), name, trackIds: [] };
  playlists.push(pl);
  closeModal();
  await dbPut('playlists', pl);
  setSoundSeg('playlists');
}
function addToPlaylistPrompt(trackId) {
  const body = document.getElementById('modalBody');
  if (playlists.length === 0) {
    body.innerHTML = `
      <h3>No playlists yet</h3>
      <p style="color:var(--text-dim); font-size:14px;">Create a playlist first, then add songs to it.</p>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal()">Close</button>
        <button class="btn teal" onclick="closeModal(); openPlaylistModal();">New playlist</button>
      </div>`;
  } else {
    body.innerHTML = `
      <h3>Add to playlist</h3>
      <div class="field"><select id="plSelect">${playlists.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}</select></div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal()">Cancel</button>
        <button class="btn teal" onclick="confirmAddToPlaylist('${trackId}')">Add</button>
      </div>`;
  }
  document.getElementById('modalBackdrop').classList.add('active');
}
async function confirmAddToPlaylist(trackId) {
  const plId = document.getElementById('plSelect').value;
  const pl = playlists.find(p => p.id === plId);
  if (pl && !pl.trackIds.includes(trackId)) { pl.trackIds.push(trackId); await dbPut('playlists', pl); }
  closeModal();
}
function closeModal() { document.getElementById('modalBackdrop').classList.remove('active'); }
document.getElementById('modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') closeModal(); });
</script>
</body>
